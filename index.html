<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chip Casino</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0d12;--card:#151923;--card2:#1c2130;--text:#f7f8fb;--muted:#8f98aa;--accent:#8b5cf6;--green:#36d399;--red:#fb7185}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#25203e,#0b0d12 42%);color:var(--text);font:15px Inter,system-ui,sans-serif;padding-bottom:82px}button,input{font:inherit}button{border:0;cursor:pointer;color:#fff}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:900;font-size:21px}.balance{background:#201b33;padding:10px 14px;border-radius:14px;color:#d9c8ff;font-weight:800}.card{background:linear-gradient(180deg,#171b27,#12151e);border:1px solid #262c3a;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 10px 30px #0002}.hero{padding:20px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.games{grid-template-columns:repeat(2,1fr)}.game{min-height:120px;text-align:left;padding:16px;border-radius:18px;background:var(--card2);border:1px solid #2a3040}.game b{display:block;font-size:17px;margin:8px 0}.game span{color:var(--muted);font-size:12px}.btn{background:var(--accent);padding:12px 15px;border-radius:13px;font-weight:800}.btn.secondary{background:#272d3c}.btn.green{background:#16a36f}.btn.red{background:#be3c58}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.input{width:100%;background:#0d1017;border:1px solid #303748;color:#fff;padding:12px;border-radius:12px;outline:none}.hidden{display:none}.nav{position:fixed;bottom:0;left:0;right:0;background:#10131bfa;border-top:1px solid #262b38;display:flex;justify-content:center;z-index:5;backdrop-filter:blur(15px)}.nav button{background:none;color:#8d95a6;padding:11px 9px;min-width:70px}.nav button.active{color:#fff}.nav i{font-style:normal;display:block;font-size:20px}.title{font-size:22px;font-weight:900;margin:8px 0 14px}.stat{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #252a35}.pill{display:inline-block;background:#242a39;border-radius:999px;padding:5px 9px;font-size:12px}.minegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}.cell{aspect-ratio:1;border-radius:11px;background:#292f3e;font-size:18px}.cell.open{background:#164f43}.plinko{height:230px;position:relative;overflow:hidden;background:#0e1118;border-radius:16px}.peg{position:absolute;width:7px;height:7px;background:#d8dbe4;border-radius:50%}.ball{position:absolute;width:18px;height:18px;background:#fbbf24;border-radius:50%;transition:left .08s,top .08s}.slotgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;font-size:27px;text-align:center}.slotcell{background:#252b39;border-radius:8px;padding:8px}.notice{padding:10px;border-radius:12px;background:#181d28;color:#c5ccda;font-size:13px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{background:#202634;padding:9px 13px;border-radius:10px}.tabs button.sel{background:var(--accent)}@media(min-width:700px){.games{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand">🎰 CHIP CASINO</div><div class="balance">🪙 <span id="bal">—</span></div></div>
<div id="app"></div>
</div>
<nav class="nav">
<button data-page="home" onclick="page('home')">🏠<small>Главная</small></button>
<button data-page="games" onclick="page('games')">🎮<small>Игры</small></button>
<button data-page="friends" onclick="page('friends')">👥<small>Друзья</small></button>
<button data-page="tasks" onclick="page('tasks')">🎁<small>Задания</small></button>
<button data-page="profile" onclick="page('profile')">👤<small>Профиль</small></button>
</nav>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
let P=null, current=null, mine=[];
const api=async(url,opts={})=>{opts.headers={...(opts.headers||{}),'X-Telegram-Init-Data':tg?.initData||''};let r=await fetch(url,opts);let j=await r.json();if(!j.ok&&j.error)toast(j.error);return j};
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(s){tg?.showAlert?s&&tg.showAlert(s):alert(s)}
function setBal(x){P.balance=x;document.querySelector('#bal').textContent=Number(x).toLocaleString('ru-RU')}
async function load(){let j=await api('/api/auth');if(!j.ok)return;P=j.profile;setBal(P.balance);page('home')}
function nav(n){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===n))}
function page(n){nav(n);({home:home,games:games,friends:friends,tasks:tasks,profile:profile}[n]||home)()}
function home(){app.innerHTML=`<div class="card hero"><div class="muted">Добро пожаловать</div><h1>${esc(P.first_name||P.username||'Игрок')} 👋</h1><div class="balance">Баланс: 🪙 ${P.balance.toLocaleString()}</div></div><div class="title">🔥 Быстрые игры</div><div class="grid games">
<div class="game" onclick="openGame('plinko')">🎯<b>Плинко</b><span>Шарики и множители</span></div>
<div class="game" onclick="openGame('mines')">💣<b>Мины</b><span>Открой безопасные клетки</span></div>
<div class="game" onclick="openGame('sweet')">🍬<b>Sweet Bonanza</b><span>Каскадный слот</span></div>
<div class="game" onclick="openGame('hilo')">🃏<b>Hi-Lo</b><span>Выше или ниже</span></div>
<div class="game" onclick="openGame('upgrader')">🚀<b>Апгрейдер</b><span>Рискни ради цели</span></div></div>`}
function games(){app.innerHTML=`<div class="title">🎮 Игры</div><div class="notice">Все ставки и выигрыши здесь — только виртуальные монеты.</div><br><div class="grid games">
<div class="game" onclick="openGame('plinko')">🎯<b>Плинко</b><span>Ряды, турбо, несколько шаров</span></div>
<div class="game" onclick="openGame('mines')">💣<b>Мины</b><span>1–24 мины на поле 5×5</span></div>
<div class="game" onclick="openGame('sweet')">🍬<b>Sweet Bonanza</b><span>Каскады и бонус</span></div>
<div class="game" onclick="openGame('hilo')">🃏<b>Hi-Lo</b><span>Угадай следующую карту</span></div>
<div class="game" onclick="openGame('upgrader')">⚡<b>Апгрейдер</b><span>Цель до 100×</span></div></div>`}
function betInput(v=100){return `<input id="bet" class="input" type="number" min="1" value="${v}">`}
function openGame(g){current=g; if(g==='plinko')plinko();if(g==='mines')minesUI();if(g==='sweet')sweet();if(g==='hilo')hilo();if(g==='upgrader')upgrader()}
function back(){page('games')}
function plinko(){app.innerHTML=`<div class="title">🎯 Плинко</div><div class="card"><div class="row"><div>${betInput()}</div><div><select id="rows" class="input"><option>8</option><option selected>12</option><option>16</option></select></div></div><br><button class="btn" onclick="dropPlinko()">Сбросить шар</button><div id="plinko" class="plinko" style="margin-top:12px"></div><div id="res" class="notice" style="margin-top:10px">Выбери ставку и ряды.</div></div><button class="btn secondary" onclick="back()">← Назад</button>`}
async function dropPlinko(){let bet=+document.querySelector('#bet').value,rows=+document.querySelector('#rows').value,j=await post('/api/game/plinko',{bet,rows});if(!j.ok)return;setBal(j.balance);let p=document.querySelector('#plinko');p.innerHTML='';for(let r=0;r<rows;r++)for(let c=0;c<r+2;c++){let e=document.createElement('i');e.className='peg';e.style.left=(45+(c-(r+1)/2)*6)+'%';e.style.top=(8+r*5.5)+'%';p.appendChild(e)}let b=document.createElement('i');b.className='ball';b.style.left='49%';b.style.top='0';p.appendChild(b);let x=49;for(let i=0;i<rows;i++){await new Promise(r=>setTimeout(r,40));x+=j.path[i]*2.2;b.style.left=x+'%';b.style.top=((i+1)/rows*88)+'%'}document.querySelector('#res').innerHTML=`Множитель: <b>${j.multiplier}×</b> · Выигрыш: <b>🪙 ${j.payout.toLocaleString()}</b>`}
function minesUI(){mine=[];app.innerHTML=`<div class="title">💣 Мины</div><div class="card"><div class="row">${betInput()}<select id="mc" class="input">${Array.from({length:24},(_,i)=>`<option ${i===4?'selected':''}>${i+1}</option>`).join('')}</select></div><br><button class="btn" onclick="startMines()">Начать</button><div id="minegrid" class="minegrid"></div><div class="row" style="margin-top:10px"><button class="btn green" onclick="cashout()">Забрать</button><button class="btn secondary" onclick="back()">Назад</button></div><div id="mres" class="notice" style="margin-top:10px">Чем больше открыто клеток, тем выше риск и множитель.</div></div>`}
async function startMines(){let j=await post('/api/game/mines/start',{bet:+bet.value,mines:+mc.value});if(!j.ok)return;setBal(j.balance);document.querySelector('#minegrid').innerHTML=Array.from({length:25},(_,i)=>`<button class="cell" onclick="openMine(${i})" id="c${i}">?</button>`).join('')}
async function openMine(i){let j=await post('/api/game/mines/open',{cell:i});if(!j.ok)return;if(j.mine){document.querySelectorAll('.cell').forEach(x=>x.disabled=true);document.querySelector('#c'+i).textContent='💣';mres.textContent='Мина! Раунд проигран.';setBal(j.balance);return}document.querySelector('#c'+i).textContent='💎';document.querySelector('#c'+i).classList.add('open');document.querySelector('#c'+i).disabled=true;mres.textContent=`Множитель: ${j.multiplier}×`}
async function cashout(){let j=await post('/api/game/mines/cashout',{});if(!j.ok)return;setBal(j.balance);mres.textContent=`Вы забрали 🪙 ${j.payout.toLocaleString()} (${j.multiplier}×)`}
function sweet(){app.innerHTML=`<div class="title">🍬 Sweet Bonanza</div><div class="card"><div class="row">${betInput()}<button class="btn" onclick="spinSweet()">Вращать</button></div><label><input type="checkbox" id="ante"> Ante Bet +25%</label><div id="slot" class="slotgrid" style="margin-top:14px"></div><div id="sres" class="notice" style="margin-top:10px">Каскадный режим. Бонус может дать множитель.</div></div><button class="btn secondary" onclick="back()">← Назад</button>`}
async function spinSweet(){let j=await post('/api/game/sweet',{bet:+bet.value,ante:ante.checked});if(!j.ok)return;setBal(j.balance);slot.innerHTML=j.grid.map(x=>`<div class="slotcell">${x}</div>`).join('');sres.innerHTML=`${j.bonus?'🎉 БОНУС! ':''}Множитель <b>${j.multiplier}×</b> · выигрыш <b>🪙 ${j.payout.toLocaleString()}</b>`}
function hilo(){app.innerHTML=`<div class="title">🃏 Hi-Lo</div><div class="card"><div class="notice">Текущая карта: <b id="card">—</b></div><br>${betInput()}<br><br><div class="row"><button class="btn" onclick="guess('hi')">⬆️ Hi</button><button class="btn" onclick="guess('lo')">⬇️ Lo</button></div><div id="hres" class="notice" style="margin-top:10px">Начни раунд.</div></div><button class="btn secondary" onclick="back()">← Назад</button>`}
let hiloState=null;async function guess(g){if(!hiloState){let j=await post('/api/game/hilo',{bet:+bet.value});if(!j.ok)return;hiloState=j;card.textContent=j.current;hres.textContent='Выбирай Hi или Lo.';return}let j=await post('/api/game/hilo/guess',{bet:hiloState.bet,current:hiloState.current,guess:g});if(!j.ok)return;setBal(j.balance);hres.innerHTML=`Следующая карта: <b>${j.next}</b> — ${j.win?'угадал!':'не угадал.'} ${j.win?'🪙 '+j.payout+' ('+j.multiplier+'×)':''}`;hiloState=null;card.textContent='—'}
function upgrader(){app.innerHTML=`<div class="title">⚡ Апгрейдер</div><div class="card">${betInput()}<br><br><label>Цель: <b><span id="tv">2</span>×</b></label><input id="target" type="range" min="1.05" max="100" value="2" step="0.05" style="width:100%" oninput="tv.textContent=this.value"><br><button class="btn" style="width:100%;margin-top:12px" onclick="upgrade()">Крутить</button><div id="ures" class="notice" style="margin-top:10px">Чем выше цель, тем ниже шанс.</div></div><button class="btn secondary" onclick="back()">← Назад</button>`}
async function upgrade(){let j=await post('/api/game/upgrader',{bet:+bet.value,target:+target.value});if(!j.ok)return;setBal(j.balance);ures.innerHTML=`${j.win?'🎉 Успех!':'💥 Не повезло.'} Шанс был <b>${j.chance}%</b>. ${j.win?'Выигрыш: 🪙 '+j.payout:''}`}
function profile(){app.innerHTML=`<div class="title">👤 Профиль</div><div class="card"><h2>${esc(P.first_name||'Игрок')}</h2><div class="stat"><span>Баланс</span><b>🪙 ${P.balance.toLocaleString()}</b></div><div class="stat"><span>Игр</span><b>${P.games}</b></div><div class="stat"><span>Побед</span><b>${P.wins}</b></div><div class="stat"><span>Оборот ставок</span><b>🪙 ${P.wagered.toLocaleString()}</b></div><div class="stat"><span>Всего выиграно</span><b>🪙 ${P.won.toLocaleString()}</b></div></div><div class="card"><b>🔗 Реферальная ссылка</b><div class="row" style="margin-top:9px"><input class="input" readonly value="${esc(P.referral)}" id="ref"><button class="btn" onclick="navigator.clipboard.writeText(ref.value);toast('Ссылка скопирована')">Копировать</button></div><p class="muted">3% от виртуальных монет, потраченных приглашённым игроком, начисляется пригласившему.</p></div><div class="card"><b>🎁 Ежедневная награда</b><p class="muted">Обновление каждый день в 00:00 по локальному времени устройства.</p><button class="btn ${P.daily.claimed?'secondary':''}" onclick="claimDaily()" ${P.daily.claimed?'disabled':''}>${P.daily.claimed?'Получено сегодня':'Забрать '+P.daily.reward+' 🪙'}</button></div>`}
async function claimDaily(){let j=await post('/api/daily',{});if(j.ok){setBal(j.balance);P.daily.claimed=true;profile()}}
async function tasks(){app.innerHTML=`<div class="title">🎁 Задания</div><div class="card"><b>Ежедневная награда</b><p class="muted">Забрать можно один раз в день, после 00:00 доступна снова.</p><button class="btn ${P.daily.claimed?'secondary':''}" onclick="claimDaily()" ${P.daily.claimed?'disabled':''}>${P.daily.claimed?'Получено':'Забрать '+P.daily.reward+' 🪙'}</button></div>`+`<div class="card"><b>📣 Подписка на канал</b><p class="muted">Подпишись на канал, затем нажми проверить.</p><button class="btn" onclick="checkTask()">Проверить</button></div>`}
async function checkTask(){let j=await post('/api/task/check',{task_id:'@your_channel'});if(j.ok){setBal(j.balance);toast('Награда начислена!');tasks()}}
async function friends(){app.innerHTML=`<div class="title">👥 Друзья</div><div class="tabs"><button class="sel" onclick="roomsTab()">Комнаты</button><button onclick="topTab()">Топ</button></div><div id="friendbody"></div>`;roomsTab()}
function roomsTab(){friendbody.innerHTML=`<div class="card"><b>Создать комнату</b><p class="muted">Игроки смогут зайти по 6-символьному коду.</p><button class="btn" onclick="createRoom()">Создать</button></div><div class="card"><b>Войти в комнату</b><div class="row" style="margin-top:10px"><input id="rcode" maxlength="6" class="input" placeholder="ABC123"><button class="btn" onclick="joinRoom()">Войти</button></div></div>`}
async function createRoom(){let j=await post('/api/room/create',{});if(j.ok){friendbody.innerHTML=`<div class="card"><h2>Комната ${j.code}</h2><div class="notice">Передай код друзьям: <b>${j.code}</b></div><button class="btn" onclick="roomInfo('${j.code}')">Обновить игроков</button><div id="players"></div></div>`}}
async function joinRoom(){let j=await post('/api/room/join',{code:rcode.value});if(j.ok)roomInfo(j.code)}
async function roomInfo(c){let j=await api('/api/room/'+c);if(!j.ok)return;friendbody.innerHTML=`<div class="card"><h2>Комната ${c}</h2>${j.players.map(x=>`<div class="stat"><span>${esc(x.first_name||x.username||x.id)}</span><b>🪙 ${x.balance.toLocaleString()}</b></div>`).join('')}</div>`}
async function topTab(){let j=await api('/api/top');if(!j.ok)return;friendbody.innerHTML=`<div class="card"><h3>💰 Самые богатые</h3>${j.rich.map((x,i)=>`<div class="stat"><span>#${i+1} ${esc(x.first_name||x.username||'Игрок')}</span><b>🪙 ${x.balance.toLocaleString()}</b></div>`).join('')}</div><div class="card"><h3>🔥 Самые активные</h3>${j.active.map((x,i)=>`<div class="stat"><span>#${i+1} ${esc(x.first_name||x.username||'Игрок')}</span><b>${x.games} игр</b></div>`).join('')}</div>`}
load();
</script>
</body></html>
